plugins {
	id 'eclipse'
	id 'idea'
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.141'
	id 'maven-publish'
}

base {
	archivesName = project.mod_id + "-lt"
}
group = project.maven_group

def env = System.getenv()
if (env.GITHUB_RUN_NUMBER) {
    version = "$mod_version.${env.GITHUB_RUN_NUMBER}+$release_minecraft_version"
} else {
    version = "$mod_version.0-SNAPSHOT+$release_minecraft_version"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			programArguments.addAll '--username', 'Dev###'
		}

		server {
			server()
			programArgument '--nogui'
		}

		configureEach {
			logLevel = org.slf4j.event.Level.WARN
		}
	}

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
			mod_id: mod_id,
			mod_version: mod_version,
	]
	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        if (env.MAVEN_URL) {
            maven {
                credentials {
                    username env.MAVEN_USERNAME
                    password env.MAVEN_PASSWORD
                }
                url env.MAVEN_URL
            }
        } else {
            println("Warning: no MAVEN_URL specified, publishing to mavenLocal")
            mavenLocal()
        }
    }
}
